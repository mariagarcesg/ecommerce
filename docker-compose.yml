services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Plantilla por microservicio (reemplazar <servicio> y descomentar):
  # <servicio>:
  #   build: ./microservicios/<servicio>
  #   environment:
  #     DB_HOST: db
  #     DB_NAME: ${POSTGRES_DB:-ecommerce}
  #     DB_USER: <servicio>
  #     DB_PASSWORD: <servicio>
  #     DB_SCHEMA: <servicio>
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"

volumes:
  db-data:
