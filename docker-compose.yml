services:
  # ---------- Bases de datos ----------

  # PostgreSQL: esquemas auth, ordenes y analitica
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MongoDB: base catalogo
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: sesiones, tokens revocados y límite de intentos de auth
  redis:
    image: redis:7
    container_name: ecommerce-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}

  # ---------- Microservicios ----------
  # Descomentar cada uno cuando tenga su Dockerfile.

  catalogo:          # Node.js + MongoDB
    build: ./microservicios/catalogo
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://catalogo:catalogo@mongo:27017/catalogo}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-clave-larga}
      PORT: ${CATALOGO_PORT:-3000}
      CATALOGO_PORT: ${CATALOGO_PORT:-3000}
    depends_on:
      mongo:
        condition: service_healthy

  auth:              # Go + PostgreSQL (esquema auth) + Redis
    build: ./microservicios/auth
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ecommerce}
      DB_USER: auth
      DB_PASSWORD: auth
      DB_SCHEMA: auth
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-clave-larga}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ordenes:           # Java + PostgreSQL (esquema ordenes)
    build: ./microservicios/ordenes
    ports:
      - "8082:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ecommerce}
      DB_USER: ordenes
      DB_PASSWORD: ordenes
      DB_SCHEMA: ordenes
      CATALOGO_URL: http://catalogo:3000
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-clave-larga}
    depends_on:
      db:
        condition: service_healthy

  analitica:          # Python: API de reportes (solo admin) y recomendaciones
    build: ./microservicios/analitica
    # Sin puerto publicado: se accede por el gateway en /api/analitica/.
    # El dashboard Streamlit (app.py) queda para uso local: streamlit run app.py
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CATALOGO_URL: http://catalogo:3000
      AUTH_URL: http://auth:8081
      ORDENES_URL: http://ordenes:8080
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-clave-larga}
    depends_on:
      - catalogo
      - auth

  # ---------- Entrada ----------

  # Única entrada desde el navegador: http://localhost:8080
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - auth
      - catalogo
      - ordenes
      - analitica

  # Sin puerto publicado: se accede a través del gateway.
  frontend:
    build: ./frontend

volumes:
  db-data:
  mongo-data:
  redis-data:
