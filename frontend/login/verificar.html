<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar Correo | ECOMMERCE</title>
  <link rel="stylesheet" href="../shared/styles.css?v=14">
  <link rel="stylesheet" href="login.css?v=7">
</head>
<body>
  <main class="contenido-principal" style="display:grid;place-items:center;min-height:75vh">
    <section class="card">
      <div style="text-align:center;margin-bottom:20px">
        <span class="navbar__logo-badge" style="width:48px;height:48px;font-size:1.5rem;margin:0 auto 10px">E</span>
        <h1 class="card__titulo" id="titulo">Verifica tu correo</h1>
        <p style="color:var(--color-texto-suave);font-size:0.88rem">
          Enviamos un código de 6 dígitos a <strong id="email-destino"></strong>.
          Vence en 10 minutos.
        </p>
      </div>

      <form id="form-verificar" class="formulario" novalidate>
        <div class="campo">
          <label for="codigo">Código de verificación</label>
          <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" placeholder="000000" required
                 style="font-size:1.4rem;letter-spacing:0.5em;text-align:center">
          <small class="campo__error" id="codigo-error"></small>
        </div>

        <button class="boton boton--bloque" type="submit">Verificar y Comenzar</button>
        <p class="formulario__mensaje" id="mensaje" role="status"></p>
      </form>

      <p class="card__pie">
        ¿No te llegó? <button type="button" id="btn-reenviar" class="boton-enlace">Reenviar código</button><br>
        <span id="pie-alterno">¿Ya verificaste? Inicia sesión <a href="index.html">aquí</a></span>
      </p>
    </section>
  </main>

  <script src="../shared/layout.js?v=15"></script>
  <script src="verificar.js?v=9"></script>
</body>
</html>
