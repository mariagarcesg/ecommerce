<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | ecommerce</title>
  <link rel="stylesheet" href="../shared/styles.css?v=5">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="contenido">
    <section class="card">
      <h1 class="card__titulo">Iniciar sesión</h1>

      <form id="form-login" class="formulario" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="tu@correo.com" required>
          <small class="campo__error" id="email-error"></small>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="••••••••" required>
          <small class="campo__error" id="password-error"></small>
        </div>

        <button class="boton boton--bloque" type="submit">Ingresar</button>
        <p class="formulario__mensaje" id="mensaje" role="status"></p>
      </form>

      <p class="card__pie">¿No tienes cuenta aún? Regístrate <a href="registro.html">aquí</a></p>
    </section>
  </main>

  <script src="../shared/layout.js?v=5"></script>
  <script src="login.js"></script>
</body>
</html>
