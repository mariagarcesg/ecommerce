<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | ecommerce</title>
  <link rel="stylesheet" href="../shared/styles.css?v=5">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="contenido">
    <section class="card">
      <h1 class="card__titulo">Crear cuenta</h1>

      <form id="form-registro" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name"
                 placeholder="Tu nombre" required>
          <small class="campo__error" id="nombre-error"></small>
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="tu@correo.com" required>
          <small class="campo__error" id="email-error"></small>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="Mínimo 8 caracteres" required>
          <small class="campo__error" id="password-error"></small>
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password"
                 placeholder="Repite la contraseña" required>
          <small class="campo__error" id="confirmar-error"></small>
        </div>

        <button class="boton boton--bloque" type="submit">Registrarme</button>
        <p class="formulario__mensaje" id="mensaje" role="status"></p>
      </form>

      <p class="card__pie">¿Ya tienes cuenta? Inicia sesión <a href="index.html">aquí</a></p>
    </section>
  </main>

  <script src="../shared/layout.js?v=5"></script>
  <script src="registro.js"></script>
</body>
</html>
