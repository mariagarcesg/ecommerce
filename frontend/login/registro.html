<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Cuenta | ECOMMERCE</title>
  <link rel="stylesheet" href="../shared/styles.css?v=6">
  <link rel="stylesheet" href="login.css?v=6">
</head>
<body>
  <main class="contenido-principal" style="display:grid;place-items:center;min-height:75vh">
    <section class="card">
      <div style="text-align:center;margin-bottom:20px">
        <span class="navbar__logo-badge" style="width:48px;height:48px;font-size:1.5rem;margin:0 auto 10px">E</span>
        <h1 class="card__titulo">Crear Cuenta</h1>
        <p style="color:var(--color-texto-suave);font-size:0.88rem">Únete a nuestra plataforma de compras en línea</p>
      </div>

      <form id="form-registro" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name"
                 placeholder="Ej: Pedro Pérez" required>
          <small class="campo__error" id="nombre-error"></small>
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="tu@correo.com" required>
          <small class="campo__error" id="email-error"></small>
        </div>

        <div class="campo">
          <label for="password">Contraseña (mínimo 8 caracteres)</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="••••••••" required>
          <small class="campo__error" id="password-error"></small>
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password"
                 placeholder="••••••••" required>
          <small class="campo__error" id="confirmar-error"></small>
        </div>

        <button class="boton boton--bloque" type="submit">Registrarse y Comenzar</button>
        <p class="formulario__mensaje" id="mensaje" role="status"></p>
      </form>

      <p class="card__pie">¿Ya tienes cuenta? Inicia sesión <a href="index.html">aquí</a></p>
    </section>
  </main>

  <script src="../shared/layout.js?v=6"></script>
  <script src="registro.js?v=6"></script>
</body>
</html>
