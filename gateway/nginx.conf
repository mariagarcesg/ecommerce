# Punto de entrada único: http://localhost:8080
# Reparte cada ruta al contenedor correspondiente (por su nombre en docker-compose).
# La barra final en proxy_pass quita el prefijo: /api/auth/login -> auth:8081/login

server {
    listen 80;

    location /api/auth/ {
        proxy_pass http://auth:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/catalogo/ {
        # Las fotos de productos pesan hasta 2 MB (catalogo rechaza más); nginx corta en 1 MB por defecto
        client_max_body_size 3m;
        proxy_pass http://catalogo:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ordenes ya expone sus rutas bajo /api/ordenes, así que se pasa la URI tal cual
    # (sin barra final, para que POST /api/ordenes no reciba un 301 de nginx)
    location /api/ordenes {
        proxy_pass http://ordenes:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/analitica/ {
        proxy_pass http://analitica:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}
